<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Timeline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#1f2937; background:#fff; }
    .header { padding:16px 18px; background:#202123; color:#fff; }
    .header strong { font-size:16px; }
    .header small { display:block; margin-top:4px; color:#c7c9cc; }
    .section { padding:13px 16px; border-bottom:1px solid #e5e7eb; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .label { margin-bottom:7px; font-size:11px; font-weight:600; color:#6b7280; text-transform:uppercase; }
    select,button { width:100%; padding:8px 10px; border:1px solid #d1d5db; border-radius:7px; background:inherit; color:inherit; }
    button { cursor:pointer; font-weight:600; }
    button:disabled { opacity:.55; cursor:default; }
    .toggle { width:42px; height:23px; border-radius:13px; background:#d1d5db; position:relative; cursor:pointer; flex:none; }
    .toggle::after { content:""; position:absolute; width:19px; height:19px; left:2px; top:2px; border-radius:50%; background:#fff; box-shadow:0 1px 3px #0003; transition:.15s; }
    .toggle.active { background:#10a37f; }
    .toggle.active::after { transform:translateX(19px); }
    .status { padding:12px 16px; display:flex; align-items:center; justify-content:space-between; background:#f8fafc; }
    #count { font-weight:700; }
    .api-status { font-size:11px; }
    .api-status.ok { color:#0d9373; }
    .api-status.err { color:#b45309; }
    .hint { margin-top:7px; font-size:11px; line-height:1.45; color:#6b7280; }
    @media (prefers-color-scheme: dark) {
      body { background:#202123; color:#f3f4f6; }
      .section { border-color:#374151; }
      .status { background:#2a2b2f; }
      select,button { border-color:#4b5563; }
    }
  </style>
</head>
<body>
  <div class="header">
    <strong>ChatGPT Timeline</strong>
    <small>v2.5.0 · 聊天时间线</small>
  </div>
  <div class="section row">
    <span>启用扩展</span>
    <div class="toggle active" id="toggle" role="switch" aria-checked="true"></div>
  </div>
  <div class="status">
    <span>已显示 <span id="count">-</span> 个时间标签</span>
    <span class="api-status ok" id="apiStatus"><span id="apiStatusText">正在加载</span></span>
  </div>
  <div class="section row">
    <span>原生侧边栏显示时间</span>
    <div class="toggle" id="sidebarTimeToggle" role="switch" aria-checked="false"></div>
  </div>
  <div class="section row">
    <span>聊天消息显示时间戳</span>
    <div class="toggle" id="messageTimeToggle" role="switch" aria-checked="false"></div>
  </div>
  <div class="section">
    <div class="label">侧边栏时间字号</div>
    <select id="size">
      <option value="small">小</option>
      <option value="medium">中</option>
      <option value="large">大</option>
    </select>
    <div class="hint">侧边栏格式：2026-08-24 10:05 D1（D1=周一，D7=周日）。消息时间戳格式：2026-08-24 09:46:21。</div>
  </div>
  <div class="section">
    <button id="refresh"><span id="refreshText">完整刷新 / 重建缓存</span></button>
    <div class="hint">通常无需使用：聊天目录会保存在本地，平时只增量检查新增或发生变化的记录。</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
